# DNBSEQ Complete WGS Pipeline Configuration

# Input and Output
input: "samples.txt"  # Sample list file
outdir: "results"     # Output directory

# Reference and databases
reference: "/path/to/reference/hg38.fa"
vep_cache_dir: "/path/to/vep/cache"

# Containers
container: "/path/to/CWGS.sif"
deepvariant_container: "/path/to/deepvariant.sif"
vep_container: "/path/to/vep.sif"

# Scripts and modules
script_dir: "scripts"
module_dir: "modules"

# Analysis parameters
chromosomes: ["chr1", "chr2", "chr3", "chr4", "chr5", "chr6", "chr7", "chr8", "chr9", "chr10", "chr11", "chr12", "chr13", "chr14", "chr15", "chr16", "chr17", "chr18", "chr19", "chr20", "chr21", "chr22", "chrX", "chrY"]
aligners: ["bwa"]
varcallers: ["dv"]
read_len: 150  # Default read length

# Threading
threads: 16

# Optional analysis modules (set to true to enable)
enable_hla: false
enable_gangstr: false
enable_cnv: false
enable_pangenie: false
enable_soapnuke_qc: false

# Additional database paths for optional modules
hlala_db: "/path/to/hlala/PRG_MHC_GRCh38_withIMGT"
gangstr_bed: "/path/to/GANGstr/hg38_ver17.bed"
pangenie_index: "/path/to/pangenie/HPRC_index"
pangenie_biallelic: "/path/to/pangenie/cactus_filtered_ids_biallelic.vcf.gz"
pangenie_convert_script: "/usr/local/app/pangenie/pipelines/run-from-callset/scripts/convert-to-biallelic.py"
gene_bed: "/path/to/genes/genes.bed"
benchmark_standard: "giab"
reference_name: "hg38"
splitFqNum: 1000000

# Quality control
min_span: 5000  # Minimum SPAN for phase blocks (used in band.py)
mapq_threshold: 20  # Minimum mapping quality

# DeepVariant settings
dv_model: "WGS"

# Singularity configuration
singularity_path: "/usr/bin/singularity"

# Cluster configuration (optional)
cluster:
  partition: "debug"
  queue: "mgi.q"
  project: "W21P0024"
